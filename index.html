<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Lets the game open full-screen, like an app, when added to the iPhone or iPad home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="corre robby" />
    <meta name="theme-color" content="#9ad8ff" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- The picture shown in a browser tab, and on the home screen of a phone or tablet. -->
    <link rel="icon" type="image/png" href="./icon-512.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>corre, robby, corre</title>
  </head>
  <body>
    <!--
      The words on this page are filled in from src/text.js when the game starts:
      data-t="key" sets an element's text, data-t-label="key" sets its spoken label.
      data-emoji="⭐" fills an element with a little picture: a file from public/art/emoji,
      never the device's own emoji (see src/emoji.js).
    -->
    <canvas id="scene"></canvas>

    <!-- Shown while running -->
    <div id="hud" class="hud" hidden>
      <div class="hud-row">
        <div class="pill" data-t-label="labelScore"><span aria-hidden="true" data-emoji="⭐"></span> <span id="score">0</span></div>
        <div class="hud-buttons">
          <button id="btn-mute" class="icon-btn" type="button" data-t-label="soundControls" aria-haspopup="dialog"></button>
          <button id="btn-pause" class="icon-btn" type="button" data-t-label="labelPause">
            <span class="pause-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <!-- Tapping the question says it out loud again. -->
      <button id="question" class="question" type="button" data-t-label="labelRepeat"></button>
      <!-- The same question in words, for a grown-up to read aloud if the device has no voice. -->
      <div id="ask" class="ask"></div>
      <!-- One dot for each door in the run: gold for right, grey for missed. -->
      <div id="progress" class="progress" aria-hidden="true"></div>
      <div id="hint" class="hint" data-t="hint" hidden></div>
      <!-- A big bouncy word with stars, for praise, tricks and a cleared level. -->
      <div id="wow" class="wow" aria-hidden="true" hidden></div>
    </div>

    <!-- The very first time: pick a language. Two big buttons, each with a flag, so a
         child can pick too. -->
    <section id="screen-language" class="screen" hidden>
      <div class="start">
        <img class="language-logo" src="./icon-512.png" alt="corre, robby, corre" />
        <div class="panel">
          <div id="language-pick" class="language-pick"></div>
        </div>
      </div>
    </section>

    <!-- Start -->
    <section id="screen-start" class="screen">
      <!-- The title sits above the card, on the sky. -->
      <div class="start">
        <h1 id="title">corre, robby, corre</h1>
        <div class="panel">
        <p id="stats" class="stats"></p>
        <div id="characters" class="characters"></div>
        <p id="unlock-note" class="note"></p>
        <div id="games" class="games"></div>
        <!-- How hard: the child's age. Each age has its own steps in every game. -->
        <div id="ages" class="ages" role="group" data-t-label="labelAge"></div>
        <!-- The ten levels of the chosen game: gold once cleared, grey until they open. -->
        <div id="levels" class="levels" role="group" data-t-label="labelLevels"></div>
        <div class="play-row">
          <button id="btn-play" class="big-btn" type="button" data-t="play"></button>
          <button id="btn-sound-start" class="small-btn toggle-btn" type="button" data-t-label="soundControls" data-emoji="🔊" aria-haspopup="dialog"></button>
          <!-- Speed, sound, music, language and endless mode are on the settings screen. -->
          <button id="btn-settings" class="small-btn toggle-btn" type="button" data-t-label="labelSettings" data-emoji="⚙️"></button>
        </div>
        <!-- Shown only when this device has no voice for the chosen language. -->
        <p id="voice-note" class="voice-note" hidden></p>
        </div>
      </div>
    </section>

    <!-- Untimed practice: the overlay leaves the real doors and belt touchable. -->
    <section id="screen-tutorial" class="screen tutorial" hidden>
      <div class="tutorial-card">
        <p class="tutorial-title" data-t="tutorialTitle"></p>
        <p id="tutorial-instruction" aria-live="polite"></p>
        <div class="tutorial-actions">
          <button id="btn-tutorial-sound" class="small-btn" type="button" data-t-label="soundControls" data-emoji="⚙️" aria-haspopup="dialog"></button>
          <button id="btn-tutorial-repeat" class="small-btn" type="button" data-t-label="labelRepeat" data-emoji="🔊"></button>
          <button id="btn-tutorial-skip" class="quiet-btn" type="button" data-t="tutorialSkip"></button>
          <button id="btn-tutorial-done" class="big-btn" type="button" hidden><span aria-hidden="true">▶</span> <span data-t="play"></span></button>
        </div>
      </div>
      <div id="tutorial-gesture" class="tutorial-gesture" aria-hidden="true">
        <div class="gesture-trail"></div>
        <div class="gesture-hand">
          <svg viewBox="0 0 72 88" width="64" height="78">
            <path d="M23 43V12c0-9 13-9 13 0v24c0-8 12-8 12 0v3c0-7 11-7 11 0v5c0-6 10-6 10 1v19c0 9-6 16-8 21H28c-2-8-9-14-14-21L4 50c-5-8 5-15 11-8l8 9Z" fill="#fff7e8" stroke="#304178" stroke-width="3" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </section>

    <!-- Settings, for grown-ups -->
    <section id="screen-settings" class="screen" hidden>
      <div class="panel">
        <h2 data-t="settingsTitle"></h2>
        <button id="btn-tutorial" class="small-btn" type="button" data-t="howToPlay"></button>
        <!-- How fast the belt moves -->
        <div class="setting">
          <p class="setting-name" data-t="settingSpeed"></p>
          <div id="paces" class="lang-row"></div>
        </div>
        <!-- All volume controls are also one tap away from Play and the game toolbar. -->
        <div class="setting">
          <p class="setting-name" data-t="settingSound"></p>
          <button id="btn-mute-start" class="small-btn sound-btn mute-button" type="button"></button>
          <div data-volume-controls></div>
        </div>
        <div class="setting">
          <p class="setting-name" data-t="settingLanguage"></p>
          <div id="languages" class="lang-row"></div>
        </div>
        <!-- Endless: faster and faster until the first miss, for the high score table. -->
        <div class="setting">
          <p class="setting-name" data-t="advancedTitle"></p>
          <div class="button-row">
            <button id="btn-endless" class="small-btn endless-btn" type="button" data-t="endless"></button>
            <button id="btn-scores" class="small-btn" type="button" data-t="scoresButton"></button>
          </div>
        </div>
        <button id="btn-settings-done" class="big-btn" type="button" data-t="done"></button>
        <button id="btn-privacy" class="quiet-btn" type="button" data-t="privacyButton"></button>
        <!-- Native Apple tips, or configured web-only support links. -->
        <button id="btn-support" class="quiet-btn" type="button" data-t="supportButton" hidden></button>
      </div>
    </section>

    <!-- Support, for grown-ups. First a question a small child cannot answer, then the page. -->
    <section id="screen-support" class="screen" hidden>
      <div id="support-gate" class="panel">
        <h2 data-t="gateTitle"></h2>
        <p id="gate-ask" class="gate-ask"></p>
        <form id="tip-gate-form" class="tip-gate-form" hidden>
          <label for="tip-gate-answer" data-t="gateAnswer"></label>
          <input id="tip-gate-answer" type="text" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" autocomplete="off" required />
          <button id="btn-tip-gate-submit" class="small-btn" type="submit" data-t="gateContinue"></button>
        </form>
        <p id="tip-gate-status" role="status" hidden></p>
        <div id="gate-answers" class="gate-answers"></div>
        <div class="button-row">
          <button id="btn-gate-back" class="small-btn" type="button" data-t="back"></button>
        </div>
      </div>
      <div id="support-page" class="panel" hidden>
        <h2 data-t="supportTitle"></h2>
        <p class="support-text" data-t="supportText"></p>
        <div id="support-links" class="support-links"></div>
        <div id="tip-products" class="support-links" hidden></div>
        <p id="tip-status" class="support-text" role="status" aria-live="polite" hidden></p>
        <button id="btn-tips-retry" class="small-btn" type="button" data-t="tipRetry" hidden></button>
        <p class="support-thanks" data-t="supportThanks"></p>
        <div class="button-row">
          <button id="btn-support-back" class="small-btn" type="button" data-t="back"></button>
        </div>
      </div>
    </section>

    <!-- End of a run -->
    <section id="screen-over" class="screen" hidden>
      <div class="panel">
        <h2 id="over-title"></h2>
        <div id="over-stars" class="over-stars" aria-hidden="true"></div>
        <p class="score-line">
          <span data-t="scoreBefore"></span><strong id="over-score">0</strong><span data-t="scoreAfter"></span>
        </p>
        <!-- Whether the level was cleared, or how many stars clear it. -->
        <!-- The sticker earned for clearing the level. -->
        <div id="over-sticker" class="over-sticker" aria-hidden="true" hidden></div>
        <p id="over-level" class="over-level" hidden></p>
        <div id="over-unlock" class="unlock" hidden>
          <img id="over-unlock-img" alt="" />
          <p id="over-unlock-text"></p>
        </div>
        <form id="name-form" class="name-form" hidden>
          <label for="name-input" data-t="nameLabel"></label>
          <input
            id="name-input"
            type="text"
            maxlength="10"
            autocomplete="off"
            autocapitalize="words"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="done"
          />
          <button class="big-btn" type="submit" data-t="save"></button>
        </form>
        <!-- No reading needed: one big "go" button that shows what comes next (the game's
             picture and the level's number), and a little house to go back to the start. -->
        <div id="over-buttons">
          <button id="btn-again" class="big-btn go-btn" type="button" data-t-label="playAgain"></button>
          <div class="button-row">
            <button id="btn-over-scores" class="small-btn" type="button" data-t="scoresButton"></button>
            <button id="btn-home" class="small-btn home-btn" type="button" data-t-label="home" data-emoji="🏠"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- High scores -->
    <section id="screen-scores" class="screen" hidden>
      <div class="panel">
        <h2 data-t="scoresTitle"></h2>
        <ol id="score-list" class="score-list"></ol>
        <p id="score-empty" class="note" data-t="noScores" hidden></p>
        <button id="btn-scores-play" class="big-btn endless-btn" type="button" data-t="endless"></button>
        <div class="button-row">
          <button id="btn-scores-home" class="small-btn" type="button" data-t="home"></button>
        </div>
      </div>
    </section>

    <!-- Paused -->
    <section id="screen-pause" class="screen" hidden>
      <div class="panel">
        <h2 data-t="paused"></h2>
        <button id="btn-resume" class="big-btn go-btn" type="button" data-t="resume"></button>
        <div class="button-row">
          <button id="btn-pause-home" class="small-btn" type="button" data-t="home"></button>
        </div>
        <button class="small-btn sound-btn mute-button" type="button"></button>
        <div data-volume-controls></div>
      </div>
    </section>

    <dialog id="sound-dialog" class="sound-dialog" aria-labelledby="sound-title">
      <div class="panel">
        <h2 id="sound-title" data-t="soundControls"></h2>
        <button class="small-btn sound-btn mute-button" type="button"></button>
        <div data-volume-controls></div>
        <form method="dialog"><button class="big-btn" type="submit" data-t="done"></button></form>
      </div>
    </dialog>

    <template id="volume-controls-template">
      <label class="volume-control">
        <span data-t="settingMaster"></span><output aria-hidden="true"></output>
        <input class="volume-slider" data-volume="masterVolume" type="range" min="0" max="100" step="1" data-t-label="labelMasterVolume" />
      </label>
      <label class="volume-control">
        <span data-t="settingMusic"></span><output aria-hidden="true"></output>
        <input class="volume-slider" data-volume="musicVolume" type="range" min="0" max="100" step="1" data-t-label="labelMusicVolume" />
      </label>
      <label class="volume-control">
        <span data-t="settingVoice"></span><output aria-hidden="true"></output>
        <input class="volume-slider" data-volume="voiceVolume" type="range" min="0" max="100" step="1" data-t-label="labelVoiceVolume" />
      </label>
      <label class="volume-control">
        <span data-t="settingEffects"></span><output aria-hidden="true"></output>
        <input class="volume-slider" data-volume="effectsVolume" type="range" min="0" max="100" step="1" data-t-label="labelEffectsVolume" />
      </label>
    </template>

    <!-- Shown when a phone is held sideways: a phone turning back upright. -->
    <div id="rotate" class="rotate" role="img" data-t-label="labelRotate" hidden>
      <div class="rotate-phone" aria-hidden="true" data-emoji="😀"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
